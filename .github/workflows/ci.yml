name: CI

on:
  push:
  pull_request:

jobs:
  php-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP files
        run: find app config public tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Run smoke tests
        run: php tests/smoke.php
